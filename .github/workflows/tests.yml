name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # The bridge tests run offline: no serial port, no broker.
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
